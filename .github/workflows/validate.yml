name: Validate data

# Runs on every push and pull request, deliberately without a `paths:` filter.
# The previous version fired only on `data/maps.json` and `maps/**`, so an edit
# to data/interactive-data.json, to the geojson, or to sw.js ran no job at all.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Data integrity
        run: python3 scripts/check_data.py

      - name: Generated map pages are current
        run: |
          python3 scripts/build_map_pages.py
          if ! git diff --quiet; then
            echo "m/ or sitemap.xml is stale. Run scripts/build_map_pages.py and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
          echo "Generated output matches data/maps.json."
